<!doctype html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Task 2 DOM dan Form</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="container">
 <h1>Daftar Peserta</h1>
 <form id="form-peserta" novalidate>
 <label for="nama">Nama peserta</label>
 <input id="nama" name="nama" autocomplete="name"
 aria-describedby="error-nama" required>
 <small id="error-nama" class="error"></small>
 <label for="prodi">Program studi</label>
 <select id="prodi" name="prodi"
 aria-describedby="error-prodi" required>
 <option value="">Pilih program studi</option>
 <option>Teknik Informatika</option>
 <option>Sistem Informasi</option>
 </select>
 <small id="error-prodi" class="error"></small>
 <button type="submit">Tambah peserta</button>
 </form>
 <label for="filter-prodi">Filter program studi</label>
 <select id="filter-prodi">
 <option value="semua">Semua</option>
 <option>Teknik Informatika</option>
 <option>Sistem Informasi</option>
 <option>Manajemen Informatika</option>
 </select>
 <p id="status" role="status" aria-live="polite"></p>
 <section id="daftar-peserta" class="grid"
 aria-label="Daftar peserta"></section>
 </main>
 <script src="app.js" defer></script>
</body>
</html>
