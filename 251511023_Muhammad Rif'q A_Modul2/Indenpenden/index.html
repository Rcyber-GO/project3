<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Harga Interaktif</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan defer agar script dieksekusi setelah DOM siap -->
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Kalkulator Pembayaran</h1>
        
        <form id="form-kalkulator" class="card">
            <div class="form-group">
                <label for="harga">Harga Barang (Rp):</label>
                <input type="number" id="harga" min="1" placeholder="Masukkan harga" required>
            </div>
            
            <div class="form-group">
                <label for="jumlah">Jumlah Barang:</label>
                <input type="number" id="jumlah" min="1" placeholder="Masukkan jumlah" required>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="member">
                <label for="member">Pelanggan Member</label>
            </div>
            
            <button type="submit" id="btn-hitung">Hitung Total</button>
        </form>

        <!-- Area Hasil -->
        <section id="area-hasil" class="card hidden">
            <h2>Ringkasan Pembayaran</h2>
            <div id="pesan-error" class="error-text hidden"></div>
            
            <div id="detail-hasil">
                <p>Subtotal: <span id="out-subtotal">Rp0</span></p>
                <p>Diskon (<span id="out-persen-diskon">0</span>%): <span id="out-nominal-diskon">Rp0</span></p>
                <hr>
                <h3>Total Bayar: <span id="out-total">Rp0</span></h3>
            </div>
        </section>
    </main>
</body>
</html>
